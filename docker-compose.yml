services:
  postgres:
    image: postgres:16-alpine
    container_name: saas_growth_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: saas_growth
      POSTGRES_PASSWORD: saas_growth_dev
      POSTGRES_DB: saas_growth_agent
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U saas_growth -d saas_growth_agent"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: saas_growth_redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
